<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"/>
  </head>
  <body>
      <div class="container">
      <h2 style="text-align: center">
         <span style="color: blue">Create Account</span>
      </h2>
      <table border="1">
        </center>

      <div class="mb-3">
        <label for="username" class="form-label" >User Name</label>
        <input type="text" class="form-control" id="username" />
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <input
          type="email"
          class="form-control"
          id="email"
          aria-describedby="emailHelp"
        />
        <div id="emailHelp" class="form-text">
           </div>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" />
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="exampleCheck1" />
        <label class="form-check-label" for="exampleCheck1"><span style="color:fuchsia">Sign</span></label>
      </div>
      <button class="btn btn-primary" onclick="register()"><span style="color:whitesmoke">Submit</span></button>
    </div>
  </table>
 <script>
       async function register() {
        const res = await fetch("http://127.0.0.1:8000/user/registration/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          })
        });
        const data = await res.json();
        console.log(data);
      }
  </script>
  </body>
</html>
